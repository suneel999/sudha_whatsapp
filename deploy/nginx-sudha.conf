# Sudha Hospital WhatsApp bot — nginx reverse proxy
# Point your public domain here, then set the same URL in Meta webhook.

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;   # e.g. sudha-wa.yourdomain.com

    # Optional: redirect HTTP → HTTPS after certbot
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Meta webhook can send larger payloads (images)
        client_max_body_size 20M;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Health check (optional)
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}

# After SSL (certbot --nginx -d YOUR_DOMAIN_HERE), HTTPS block is usually added automatically.
# Keep the same proxy_pass to 127.0.0.1:8000 for /webhook.
