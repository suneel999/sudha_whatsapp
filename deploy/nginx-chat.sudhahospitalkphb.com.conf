# nginx — chat.sudhahospitalkphb.com → Sudha WhatsApp bot (gunicorn :8000)
# Place on server: /etc/nginx/sites-available/chat.sudhahospitalkphb.com

server {
    listen 80;
    server_name chat.sudhahospitalkphb.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }
}

# After: sudo certbot --nginx -d chat.sudhahospitalkphb.com
